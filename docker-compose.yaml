version: '3'

services:

  traefik:
    image: "traefik:v2.6.0"
    container_name: coolstuff_solutions_traefik
    command:
      - "--log.level=DEBUG"
      - "--providers.docker"
      - "--api.dashboard=true"
      - "--entrypoints.web.address=:80"
      - "--accesslog.filepath=/data/access.log"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=coolstuff-solutions"
    ports:
      - "80:80"
      - "8080:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=true"
      - "traefik.default.protocol=http"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.rule=Host(`coolstuff.localhost`)"
    networks:
      coolstuff-solutions:
        aliases:
          - traefik

  nginx:
    image: nginx:alpine
    container_name: coolstuff_solutions_nginx
    volumes:
      - ./app:/var/www
      - ./sys/nginx:/etc/nginx/conf.d/
    labels:
      - "traefik.enable=true"
    networks:
      coolstuff-solutions:
        aliases:
          - nginx

  app:
    build:
      context: .
      dockerfile: sys/php/Dockerfile
    image: coolstuff_solutions:app
    container_name: coolstuff_solutions_app
    env_file:
      - app/.env
    environment:
      APP_NAME: "CoolStuff Solutions"
    working_dir: /var/www
    volumes:
      - ./app:/var/www
      - ./app/var/:/var/www/var:rw
      - ./sys/php/default.ini:/usr/local/etc/php/conf.d/local.ini
    labels:
      - "traefik.enable=true"
      - "traefik.default.protocol=http"
      - "traefik.http.routers.app.entrypoints=web"
      - "traefik.http.routers.app.rule=Host(`app.coolstuff.localhost`)"
      - "traefik.http.services.app.loadbalancer.server.port=80"
      - "traefik.backend=app"
    networks:
      coolstuff-solutions:
        aliases:
          - app

  portal:
    container_name: coolstuff_portal
    image: coolstuffportal:local
    build:
      context: .
      dockerfile: sys/portal/Dockerfile
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portal.entrypoints=web"
      - "traefik.http.routers.portal.rule=Host(`portal.coolstuff.localhost`)"
      - "traefik.http.services.portal.loadbalancer.server.port=80"
      - "traefik.docker.network=coolstuff-solutions"
      - "traefik.default.protocol=http"
      - "traefik.backend=portal"
    networks:
      - coolstuff-solutions

  mysql:
    image: mysql:8.0
    container_name: coolstuff_solutions_rdbms
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: coolstuff_solutions_db
      MYSQL_USER: developer
      MYSQL_PASSWORD: root
    ports:
      - "9701:3306"
    volumes:
      - /var/lib/mysql
    labels:
      - "traefik.enable=false"
    networks:
      coolstuff-solutions:
        aliases:
          - mysql

  smtp:
    platform: linux/x86_64
    image: mailhog/mailhog
    container_name: coolstuff_solutions_smtp
    logging:
      driver: 'none'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.smtp.entrypoints=web"
      - "traefik.http.routers.smtp.rule=Host(`smtp.coolstuff.localhost`)"
      - "traefik.http.services.smtp.loadbalancer.server.port=8025"
      - "traefik.docker.network=coolstuff-solutions"
      - "traefik.default.protocol=http"
      - "traefik.backend=smtp"
    networks:
      coolstuff-solutions:
        aliases:
           - smtp

  phpmyadmin:
    image: phpmyadmin:5.2.0
    container_name: coolstuff_solutions_phpmyadmin
    links:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.phpmyadmin.entrypoints=web"
      - "traefik.http.routers.phpmyadmin.rule=Host(`pma.coolstuff.localhost`)"
      - "traefik.http.services.phpmyadmin.loadbalancer.server.port=80"
      - "traefik.docker.network=coolstuff-solutions"
      - "traefik.default.protocol=http"
      - "traefik.backend=phpmyadmin"
    networks:
      coolstuff-solutions:
        aliases:
          - phpmyadmin

  testing_db:
    image: mysql:5.7
    container_name: coolstuff_solutions_testind_db
    environment:
      MYSQL_ROOT_PASSWORD: 'testing'
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
      MYSQL_RANDOM_ROOT_PASSWORD: 0
      MYSQL_DATABASE: 'coolstuff_solutions_testing_db'
      MYSQL_USER: 'testuser'
      MYSQL_PASSWORD: 't3st!n6'
    tmpfs:
      - /var/lib/mysql
    labels:
      - "traefik.enable=false"
    networks:
      coolstuff-solutions:
        aliases:
          - testing_db

networks:
  coolstuff-solutions:
    name: coolstuff-solutions
    driver: bridge

volumes:
  db:
    driver: local